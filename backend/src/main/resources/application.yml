spring:
  application:
    name: material-maker-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/material_maker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:material_maker}
    password: ${DB_PASSWORD:material_maker}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.bugstack.untitled
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

app:
  upload-dir: ${UPLOAD_DIR:./runtime/uploads}
